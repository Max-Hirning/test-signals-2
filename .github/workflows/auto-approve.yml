name: Auto Approve (bot review test)

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  pull-requests: write

jobs:
  approve:
    if: contains(github.event.pull_request.title, 'bot-review')
    runs-on: ubuntu-latest
    steps:
      - run: gh pr review "${{ github.event.pull_request.number }}" --approve -b "Automated bot review (AC6.6 sandbox test)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
